[project]
name = "portfolio-lucas-api"
version = "0.1.0"
description = "REST API that delivers portfolio contact messages via email"
authors = [
    {name = "Lucas",email = "lucasdeoliveira937@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.139.0,<0.140.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
