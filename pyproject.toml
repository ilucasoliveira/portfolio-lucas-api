[project]
name = "portfolio-lucas-api"
version = "1.1.0"
description = "REST API that delivers portfolio contact messages via email"
authors = [
    {name = "Lucas de Oliveira",email = "lucasoliveirapimentel.dev@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.139.0,<0.140.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "resend (>=2.32.2,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"